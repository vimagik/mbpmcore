version: '2.15.1'

services:
  front:
    image: docker.rzhavin.pro/mbpm-front:1.0.2
    ports:
      - 3000:80
    environment:
      - BASE_URL=https://demo.rzhavin.pro


  db:
    image: postgres:15.2-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=camunda
      - POSTGRES_PASSWORD=camunda
      - POSTGRES_DB=django_db

  cms:
    image: docker.rzhavin.pro/mbpm-cms:1.0.1
    command: gunicorn mbpmcore.wsgi:application --bind 0.0.0.0:8000
    ports:
      - 8000:8000
    volumes:
      - /usr/src/static:/usr/src/app/staticfiles
    env_file:
      - .env.prod
    depends_on:
      - db

  camunda:
    image: docker.rzhavin.pro/mbpm-camunda:1.0
    environment:
      DB_DRIVER: org.postgresql.Driver
      DB_URL: jdbc:postgresql://db:5432/camunda
      DB_USERNAME: camunda
      DB_PASSWORD: camunda
    ports:
      - 8080:8080
    depends_on:
      - db

  telegram:
    image: docker.rzhavin.pro/mbpm-telegram:1.0
    command: python send_to_telegram.py
    environment:
      - CAMUNDA_HOST=camunda
    depends_on:
      - camunda

volumes:
  postgres_data:
